<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="A clinical encounter note drafted from a visit transcript, where every line shows its source. A prototype with synthetic data."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Sourced Note</title>
    <script>
      // Apply a saved dark choice before first paint, so the page never flashes light.
      try {
        if (localStorage.getItem('sn-theme') === 'dark')
          document.documentElement.setAttribute('data-mantine-color-scheme', 'dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
